<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🤍</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:sans-serif;
  background:linear-gradient(135deg,#fff6f8,#ffeef3,#fff);
}

/* UI */
h1{
  text-align:center;
  margin-top:30px;
  color:#c45c73;
}

#timer{
  text-align:center;
  margin-top:5px;
  color:#a15c6b;
}

/* Items */
.item{
  position:absolute;
  cursor:pointer;
  z-index:10;
  user-select:none;
}

/* เอฟเฟกต์กลีบ */
#petalLayer{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
}

.petal{
  position:absolute;
  top:-20px;
  animation:fall linear forwards;
  opacity:0.7;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

/* Message */
#message{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.9);
  z-index:50;
}

.message-box{
  background:white;
  padding:35px;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,0.1);
  text-align:center;
  max-width:90%;
}
</style>
</head>

<body>

<h1>Catch all the love 🤍</h1>
<div id="timer">Time left: 15</div>

<div id="petalLayer"></div>
<div id="message"></div>

<script>
let score = 0;
let timeLeft = 15;
const total = 8;
let gameActive = true;

const items = [
  "❤️",
  "💖",
  "<img src='Cat1.png' width='50'>",
  "<img src='Cat2.png' width='50'>",
  "<img src='Cat3.png' width='50'>",
  "<img src='Cat4.png' width='50'>",
  "<img src='Cat5.png' width='50'>"
];

function createItem(){
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = items[Math.floor(Math.random()*items.length)];

  let x = Math.random() * (window.innerWidth - 60);
  let y = Math.random() * (window.innerHeight - 60);

  el.style.left = x + "px";
  el.style.top = y + "px";

  let angle = Math.random() * Math.PI * 2;
  let speed = Math.random() * 1.5 + 0.5;

  let dx = Math.cos(angle) * speed;
  let dy = Math.sin(angle) * speed;

  function move(){
    if(!gameActive) return;

    x += dx;
    y += dy;

    if(x <= 0 || x >= window.innerWidth - 60) dx *= -1;
    if(y <= 0 || y >= window.innerHeight - 60) dy *= -1;

    el.style.left = x + "px";
    el.style.top = y + "px";

    requestAnimationFrame(move);
  }

  move();

  el.addEventListener("click", ()=>{
    if(!gameActive) return;

    score++;
    el.remove();

    if(score === total){
      win();
    }
  });

  document.body.appendChild(el);
}

for(let i=0;i<total;i++){
  createItem();
}

const timer = setInterval(()=>{
  if(!gameActive) return;

  timeLeft--;
  document.getElementById("timer").innerText =
    "Time left: " + timeLeft;

  if(timeLeft <= 0){
    clearInterval(timer);
    lose();
  }
},1000);

function win(){
  gameActive = false;
  clearInterval(timer);

  showMessage(`
    <div class="message-box">
      <h2>Happy Valentine’s Day 🤍</h2>
      <p>
        I hope you feel better today.<br>
        And I hope… your Valentine can be me too.<br><br>
        Love you na ka 🤍
      </p>
    </div>
  `);

  startPetals();
}

function lose(){
  gameActive = false;
  showMessage(`
    <div class="message-box">
      <h2>It's okay 🤍</h2>
      <p>
        Try again…<br>
        I’ll still be here 💕
      </p>
    </div>
  `);
}

function showMessage(text){
  const msg = document.getElementById("message");
  msg.innerHTML = text;
  msg.style.display = "flex";
}

/* กลีบกุหลาบ */
function startPetals(){
  const layer = document.getElementById("petalLayer");

  let count = 0;
  const interval = setInterval(()=>{
    if(count > 30){
      clearInterval(interval);
      return;
    }

    const petal = document.createElement("div");
    petal.className = "petal";
    petal.innerText = "🌸";

    petal.style.left = Math.random()*100 + "vw";
    petal.style.fontSize = (14 + Math.random()*10) + "px";
    petal.style.animationDuration = (6 + Math.random()*4) + "s";

    layer.appendChild(petal);

    setTimeout(()=> petal.remove(), 10000);
    count++;
  },300);
}
</script>

</body>
</html>
