<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You 💘</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:sans-serif;
  background:#fff0f5;
}

h1{
  text-align:center;
  padding-top:20px;
  color:#ff4d6d;
}

#timer{
  text-align:center;
  font-size:18px;
  color:#555;
}

.heart{
  position:absolute;
  font-size:36px;
  background:none;
  border:none;
}

#message{
  position:fixed;
  inset:0;
  background:#fff0f5;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:22px;
  color:#ff4d6d;
  padding:30px;
}
</style>
</head>

<body>

<h1>Catch all the hearts 💖</h1>
<div id="timer">Time left: 10</div>

<div id="message" style="display:none;"></div>

<script>
let score = 0;
let timeLeft = 10;
const total = 7;

function randomPos(){
  return Math.random() * 80 + "%";
}

function createHeart(){
  const heart = document.createElement("button");
  heart.className = "heart";
  heart.innerHTML = "❤️";
  heart.style.left = randomPos();
  heart.style.top = randomPos();

  heart.onclick = () => {
    score++;
    heart.remove();
    if(score === total){
      win();
    }
  };

  document.body.appendChild(heart);
}

for(let i=0;i<total;i++){
  createHeart();
}

const timer = setInterval(()=>{
  timeLeft--;
  document.getElementById("timer").innerText =
    "Time left: " + timeLeft;

  if(timeLeft === 0){
    clearInterval(timer);
    lose();
  }
},1000);

function win(){
  clearInterval(timer);
  showMessage(`
    Happy Valentine’s Day 💘<br><br>
    I hope you feel better today.<br>
    And I hope… your Valentine can be me too.<br>
    Love you na ka 🤍<br><br>
  `);
}

function lose(){
  showMessage(`
    It’s okay 🤍<br><br>
    You can try again…<br>
    I’ll still be here 💕
  `);
}

function showMessage(text){
  const msg = document.getElementById("message");
  msg.innerHTML = text;
  msg.style.display = "flex";
}
</script>

</body>
</html>
