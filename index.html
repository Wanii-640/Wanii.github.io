<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You 💘</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg,#ff9a9e,#fad0c4,#fad0c4,#ffdde1);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h1{
  text-align:center;
  padding-top:20px;
  color:white;
  text-shadow:0 0 10px rgba(255,255,255,0.8);
}

#timer{
  text-align:center;
  font-size:20px;
  color:white;
  margin-bottom:20px;
}

.item{
  position:absolute;
  font-size:40px;
  cursor:pointer;
  transition: transform 0.2s;
  filter: drop-shadow(0 0 8px white);
}

.item:hover{
  transform: scale(1.3);
}

#message{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.92);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:26px;
  color:#ff4d6d;
  padding:30px;
  backdrop-filter: blur(10px);
  display:none;
  opacity:0;
  transition:opacity 0.8s ease;
}

/* หัวใจลอย */
.heart-float{
  position:fixed;
  bottom:-20px;
  pointer-events:none;
  animation:floatUp linear forwards;
}

@keyframes floatUp{
  from{
    transform:translateY(0) scale(1);
    opacity:0.8;
  }
  to{
    transform:translateY(-110vh) scale(1.6);
    opacity:0;
  }
}
</style>
</head>

<body>

<h1>Catch all the love 💖</h1>
<div id="timer">Time left: 15</div>
<div id="message"></div>

<script>
let score = 0;
let timeLeft = 15;
const total = 10;

const items = [
  "❤️",
  "💖",
  "<img src='Cat1.png' width='60'>",
  "<img src='Cat2.png' width='60'>",
  "<img src='Cat3.png' width='60'>",
  "<img src='Cat4.png' width='60'>",
  "<img src='Cat5.png' width='60'>"
];

function createItem(){
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = items[Math.floor(Math.random()*items.length)];

  let x = Math.random() * (window.innerWidth - 80);
  let y = Math.random() * (window.innerHeight - 80);

  el.style.left = x + "px";
  el.style.top = y + "px";

  let angle = Math.random() * Math.PI * 2;
  let speed = Math.random() * 2 + 1;

  let dx = Math.cos(angle) * speed;
  let dy = Math.sin(angle) * speed;

  function move(){
    x += dx;
    y += dy;

    if (x <= 0 || x >= window.innerWidth - 80) dx *= -1;
    if (y <= 0 || y >= window.innerHeight - 80) dy *= -1;

    el.style.left = x + "px";
    el.style.top = y + "px";

    requestAnimationFrame(move);
  }

  move();

  el.onclick = () => {
    score++;
    el.remove();
    if(score === total){
      win();
    }
  };

  document.body.appendChild(el);
}

for(let i=0;i<total;i++){
  createItem();
}

const timer = setInterval(()=>{
  timeLeft--;
  document.getElementById("timer").innerText =
    "Time left: " + timeLeft;

  if(timeLeft === 0){
    clearInterval(timer);
    lose();
  }
},1000);

/* ===============================
   🎉 เอฟเฟกต์ตอนชนะ
=================================*/

function floatingHearts(){
  for(let i=0;i<30;i++){
    const heart = document.createElement("div");
    heart.className = "heart-float";
    heart.innerText = "💖";
    heart.style.left = Math.random()*100 + "vw";
    heart.style.fontSize = (Math.random()*25 + 15) + "px";
    heart.style.animationDuration = (Math.random()*2 + 3) + "s";

    document.body.appendChild(heart);
    setTimeout(()=> heart.remove(),5000);
  }
}

function heartShape(){
  const container = document.createElement("div");
  container.style.position = "fixed";
  container.style.inset = "0";
  container.style.pointerEvents = "none";

  for(let t=0; t<Math.PI*2; t+=0.1){
    const x = 16*Math.pow(Math.sin(t),3);
    const y = -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));

    const heart = document.createElement("div");
    heart.innerText = "💗";
    heart.style.position = "absolute";
    heart.style.left = (window.innerWidth/2 + x*15) + "px";
    heart.style.top = (window.innerHeight/2 + y*15) + "px";
    heart.style.fontSize = "18px";
    heart.style.opacity = "0";
    heart.style.transition = "opacity 1.5s ease";

    container.appendChild(heart);

    setTimeout(()=> heart.style.opacity="1",100);
  }

  document.body.appendChild(container);
}

function win(){
  clearInterval(timer);

  floatingHearts();
  heartShape();

  showMessage(`
    <div style="font-size:60px;">💖</div>
    Happy Valentine’s Day 💘<br><br>
    I hope you feel better today.<br>
    And I hope… your Valentine can be me too.<br>
    Love you na ka 🤍
  `);
}

function lose(){
  showMessage(`
    It's okay 🤍<br><br>
    Try again…<br>
    I'll still be here 💕
  `);
}

function showMessage(text){
  const msg = document.getElementById("message");
  msg.innerHTML = text;
  msg.style.display = "flex";
  setTimeout(()=> msg.style.opacity="1",10);
}
</script>

</body>
</html>
