<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You ❤️</title>

<style>
body{
  text-align:center;
  font-family:sans-serif;
  margin-top:80px;
}

h1{
  color:#ff4d6d;
}

#game button{
  font-size:32px;
  background:none;
  border:none;
  cursor:pointer;
  margin:10px;
}

#message{
  margin-top:40px;
  font-size:28px;
  color:#ff4d6d;
}
</style>
</head>

<body>

<h1>เก็บหัวใจให้ครบ 5 ดวง 💖</h1>

<div id="game"></div>

<div id="message"></div>

<script>
let score = 0;
const total = 5;

function collect(){
  score++;
  if(score === total){
    document.getElementById("message").innerHTML =
      "You unlocked my heart 💘<br>เราชอบเธอนะ";
  }
}

// สร้างหัวใจ
for(let i=0;i<total;i++){
  const heart = document.createElement("button");
  heart.innerHTML = "❤️";
  heart.onclick = function(){
    collect();
    heart.style.display = "none";
  };
  document.getElementById("game").appendChild(heart);
}
</script>

</body>
</html>
