<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For You 💘</title>

<style>
body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(-45deg,#ff9a9e,#fad0c4,#fad0c4,#ffdde1);
  background-size: 400% 400%;
  animation: gradientBG 12s ease infinite;
}

@keyframes gradientBG{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

h1{
  text-align:center;
  padding-top:20px;
  color:white;
  text-shadow:0 0 10px rgba(255,255,255,0.8);
}

#timer{
  text-align:center;
  font-size:20px;
  color:white;
  margin-bottom:20px;
}

.item{
  position:absolute;
  font-size:40px;
  cursor:pointer;
  transition: transform 0.2s;
  filter: drop-shadow(0 0 8px white);
}

.item:hover{
  transform: scale(1.3);
}

#message{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,0.9);
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:26px;
  color:#ff4d6d;
  padding:30px;
  backdrop-filter: blur(10px);
  display:none;
}
</style>
</head>

<body>

<h1>Catch all the love 💖</h1>
<div id="timer">Time left: 15</div>

<div id="message"></div>

<script>
let score = 0;
let timeLeft = 15;
const total = 10;

const items = [
  "❤️",
  "💖",
  "<img src='Cat1.png' width='60'>",
  "<img src='Cat2.png' width='60'>",
  "<img src='Cat3.png' width='60'>",
  "<img src='Cat4.png' width='60'>"
];

function createItem(){
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = items[Math.floor(Math.random()*items.length)];

  let x = Math.random() * (window.innerWidth - 80);
  let y = Math.random() * (window.innerHeight - 80);

  el.style.left = x + "px";
  el.style.top = y + "px";

  // สุ่มมุม 0 - 360 องศา
  let angle = Math.random() * Math.PI * 2;

  // ความเร็วสุ่ม
  let speed = Math.random() * 2 + 1;

// คำนวณทิศทางจากมุม
  let dx = Math.cos(angle) * speed;
  let dy = Math.sin(angle) * speed;

function move() {

  x += dx;
  y += dy;

  // เด้งเมื่อชนขอบ
  if (x <= 0 || x >= window.innerWidth - 80) {
    dx *= -1;
  }

  if (y <= 0 || y >= window.innerHeight - 80) {
    dy *= -1;
  }

  el.style.left = x + "px";
  el.style.top = y + "px";

  requestAnimationFrame(move);
}

move();



  el.onclick = () => {
    score++;
    el.remove();
    if(score === total){
      win();
    }
  };

  document.body.appendChild(el);
}

for(let i=0;i<total;i++){
  createItem();
}

const timer = setInterval(()=>{
  timeLeft--;
  document.getElementById("timer").innerText =
    "Time left: " + timeLeft;

  if(timeLeft === 0){
    clearInterval(timer);
    lose();
  }
},1000);

function win(){
  clearInterval(timer);
  showMessage(`
    Happy Valentine’s Day 💘<br><br>
    I hope you feel better today.<br>
    And I hope… your Valentine can be me too.<br>
    Love you na ka 🤍
  `);
}

function lose(){
  showMessage(`
    It's okay 🤍<br><br>
    Try again…<br>
    I'll still be here 💕
  `);
}

function showMessage(text){
  const msg = document.getElementById("message");
  msg.innerHTML = text;
  msg.style.display = "flex";
}
</script>

</body>
</html>
