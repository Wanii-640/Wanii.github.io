<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 🤍</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  height:100vh;
  overflow:hidden;
  font-family:'Poppins',sans-serif;
  background:linear-gradient(135deg,#fff6f8,#ffeef3,#fff);
  display:flex;
  flex-direction:column;
  align-items:center;
}

h1{
  margin-top:40px;
  font-weight:500;
  color:#c45c73;
  letter-spacing:1px;
}

#timer{
  margin-top:10px;
  font-weight:300;
  color:#b06a7b;
}

.item{
  position:absolute;
  cursor:pointer;
  transition:transform 0.3s ease;
}

.item:hover{
  transform:scale(1.2);
}

#message{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.85);
  backdrop-filter:blur(12px);
  opacity:0;
  transition:opacity 1s ease;
  z-index:100;
}

.message-box{
  width:90%;
  max-width:600px;
  padding:40px;
  border-radius:25px;
  background:rgba(255,255,255,0.7);
  box-shadow:0 20px 60px rgba(196,92,115,0.15);
  text-align:center;
  animation:fadeUp 1.5s ease forwards;
}

@keyframes fadeUp{
  from{transform:translateY(30px); opacity:0;}
  to{transform:translateY(0); opacity:1;}
}

.big-title{
  font-size:28px;
  font-weight:600;
  color:#c45c73;
  margin-bottom:20px;
}

.text{
  font-size:16px;
  font-weight:300;
  line-height:1.8;
  color:#8a4f5f;
}

/* กลีบกุหลาบ */
.petal{
  position:fixed;
  top:-20px;
  font-size:18px;
  pointer-events:none;
  animation:fall linear forwards;
}

@keyframes fall{
  to{
    transform:translateY(110vh) rotate(360deg);
    opacity:0;
  }
}

@media (min-width:768px){
  .big-title{font-size:36px;}
  .text{font-size:18px;}
}
.item{
  position:absolute;
  cursor:pointer;
  transition:transform 0.2s ease;
  z-index:5; /* อยู่เหนือกลีบ */
}

.petal{
  position:fixed;
  top:-20px;
  pointer-events:none;
  z-index:1; /* อยู่ล่างสุด */
  opacity:0.7;
  animation:fall linear forwards;
}

#message{
  z-index:20; /* สูงสุด */
}

</style>
</head>

<body>

<h1>Catch all the love 🤍</h1>
<div id="timer">Time left: 15</div>
<div id="message"></div>


<script>
let score = 0;
let timeLeft = 15;
const total = 8; // ลดลงเพื่อให้ลื่นในมือถือ

const items = [
  "🤍",
  "💖",
  "<img src='Cat1.png' width='50'>",
  "<img src='Cat2.png' width='50'>",
  "<img src='Cat3.png' width='50'>",
  "<img src='Cat4.png' width='50'>"
];

function createItem(){
  const el = document.createElement("div");
  el.className = "item";
  el.innerHTML = items[Math.floor(Math.random()*items.length)];

  let x = Math.random() * (window.innerWidth - 60);
  let y = Math.random() * (window.innerHeight - 60);

  el.style.left = x + "px";
  el.style.top = y + "px";

  let angle = Math.random() * Math.PI * 2;
  let speed = Math.random() * 1.5 + 0.5; // ช้าลงเพื่อความลื่น

  let dx = Math.cos(angle) * speed;
  let dy = Math.sin(angle) * speed;

  function move(){
    x += dx;
    y += dy;

    if(x <= 0 || x >= window.innerWidth - 60) dx *= -1;
    if(y <= 0 || y >= window.innerHeight - 60) dy *= -1;

    el.style.left = x + "px";
    el.style.top = y + "px";

    requestAnimationFrame(move);
  }

  move();

  el.onclick = ()=>{
    score++;
    el.remove();
    if(score === total) win();
  };

  document.body.appendChild(el);
}

for(let i=0;i<total;i++){
  createItem();
}

const timer = setInterval(()=>{
  timeLeft--;
  document.getElementById("timer").innerText =
    "Time left: " + timeLeft;

  if(timeLeft === 0){
    clearInterval(timer);
    lose();
  }
},1000);

function win(){
  clearInterval(timer);
  showMessage(`
    <div class="message-box">
      <div class="big-title">Happy Valentine’s Day 🤍</div>
      <div class="text">
        I hope you feel better today.<br>
        And I hope… your Valentine can be me too.<br><br>
        Love you na ka 🤍
      </div>
    </div>
  `);
  startPetals();
}

function lose(){
  showMessage(`
    <div class="message-box">
      <div class="big-title">It's okay 🤍</div>
      <div class="text">
        Try again…<br>
        I’ll still be here 💕
      </div>
    </div>
  `);
}

function showMessage(text){
  const msg = document.getElementById("message");
  msg.innerHTML = text;
  msg.style.opacity = "1";
}

/* กลีบกุหลาบแบบเบา */
function startPetals(){
  let count = 0;
  const petalInterval = setInterval(()=>{
    if(count > 25){ // จำกัดจำนวน ไม่ให้หนัก
      clearInterval(petalInterval);
      return;
    }

    const petal = document.createElement("div");
    petal.className = "petal";
    petal.innerText = "🌸";

    petal.style.left = Math.random()*100 + "vw";
    petal.style.fontSize = (14 + Math.random()*8) + "px";
    petal.style.animationDuration = (6 + Math.random()*4) + "s";

    document.body.appendChild(petal);

    setTimeout(()=> petal.remove(), 10000);
    count++;
  }, 300);
}
</script>



</body>
</html>
